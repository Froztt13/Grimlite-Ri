name: Build (macOS, Windows & Android)

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build macOS (Apple Silicon)"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows (x64)"
        type: boolean
        default: true
      build_android:
        description: "Build Android (ARMv8 / arm64-v8a)"
        type: boolean
        default: true
      publish_release:
        description: "Publish artifacts to GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (optional, e.g. v0.1.0)"
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS (Apple Silicon)
    if: ${{ inputs.build_macos == true }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository (with ruffle submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run grimlite_bot tests
        run: cargo test -p grimlite_bot

      - name: Build grimlite-ri (release)
        run: |
          cargo build --release -p grimlite-ri \
            --no-default-features \
            --features software_video,external_video,lzma,jpegxr,fontconfig-dlopen

      - name: Package Grimlite Ri.app
        run: |
          chmod +x scripts/build-macos-app.sh
          ./scripts/build-macos-app.sh --release --no-build

      - name: Build grimlite-headless (release)
        run: cargo build --release -p grimlite-headless

      - name: Archive macOS artifacts
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/bundle/Grimlite Ri.app" \
            "dist/grimlite-ri-macos-arm64.zip"
          zip -j "dist/grimlite-headless-macos-arm64.zip" "target/release/grimlite-headless"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip

  build-windows:
    name: Windows (x64)
    if: ${{ inputs.build_windows == true }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository (with ruffle submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run grimlite_bot tests
        run: cargo test -p grimlite_bot

      - name: Build grimlite-ri (release)
        run: |
          cargo build --release -p grimlite-ri `
            --no-default-features `
            --features software_video,external_video,lzma,jpegxr

      - name: Build grimlite-headless (release)
        run: cargo build --release -p grimlite-headless

      - name: Archive Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/release/grimlite-ri.exe" -DestinationPath "dist/grimlite-ri-windows-x64.zip" -Force
          Compress-Archive -Path "target/release/grimlite-headless.exe" -DestinationPath "dist/grimlite-headless-windows-x64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  build-android:
    name: Android (ARMv8 / arm64-v8a)
    if: ${{ inputs.build_android == true }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout repository (with ruffle submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Setup Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64-v8a

      - name: Run grimlite_bot tests
        run: cargo test -p grimlite_bot

      - name: Build Android APK (arm64-v8a release)
        run: |
          chmod +x scripts/build-android-apk.sh android/gradlew
          ./scripts/build-android-apk.sh --release --abi=arm64-v8a

      - name: Collect Android APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            dist/grimlite-ri-android-arm64-v8a.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: dist/*.apk

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-android]
    if: ${{ always() && inputs.publish_release == true && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (inputs.build_macos == true || inputs.build_windows == true || inputs.build_android == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="build-${{ github.run_number }}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.apk
